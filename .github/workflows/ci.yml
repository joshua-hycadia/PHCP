# PHCP continuous integration and release.
#
#   test-linux     every Python test suite (tools/test_*.py), the AutoCAD
#                  exporter's structural checks and the resolver stress; the
#                  editor, spreadsheet and isometric windows under a virtual
#                  display; the invariance stress on 60 random networks; the
#                  user guide's pictures, kept as the run's artefact; then
#                  the user guide and reference manual as Word documents,
#                  which fails the run if a table or picture is broken
#   parity         the Python against the last Perl release (PHCP 1.6.0,
#                  cfafeef), byte for byte, by tools/compare_perl.py: the
#                  text output, the JSON, the full text report, the --save
#                  results block and the exit status of each model.  A pull
#                  request or a release tag runs every example in all modes,
#                  every 10th model's text and JSON, and every 10th model's
#                  report and --save; a push to main or a run by hand every
#                  example, all 900 models' text and JSON and every 5th
#                  model's report and --save.  The report and --save leave
#                  out the grids above G050: their demand search in Perl
#                  would pass the runner's time
#   build-windows  build_windows.py on a Windows runner, exactly as on a PC:
#                  phcp.exe, phcp_editor.exe, phcp_sheet.exe and
#                  phcp_isometric.exe by PyInstaller, the smoke test in the
#                  script; the icon read back out of each, and as Windows
#                  shows it; the test suites that need no display, the
#                  impossible models through the built phcp.exe and the Revit
#                  extension; the programs are kept as the run's artefacts
#   release        on a version tag (v1.2.3) or a release published on
#                  GitHub: the programs, the user guide and the reference
#                  manual (docs/*.docx, docs/*.pdf) attached to the release,
#                  with the notes in release_notes/<tag>.md if there are any
#
# Runs on every pull request and every push to main.

name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python/Tk and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth imagemagick python3-tk
      # Every suite there is, so a new one cannot be left out of CI.  The
      # window suites start their own display and run in the next step.
      - name: Test suites
        run: |
          set -e
          for t in tools/test_*.py tools/check_lisp.py tools/stress_resolver.py; do
            case "$t" in *_window.py) continue ;; esac
            echo "== $t"
            python3 "$t"
          done
      - name: Windows suites, under Xvfb
        run: |
          set -e
          for t in tools/test_*_window.py; do
            echo "== $t"
            python3 "$t"
          done
      - name: Invariance stress, 60 random networks
        run: python3 tools/stress_invariance.py 60
      - name: The user guide's pictures, under Xvfb
        run: python3 tools/doc_screenshots.py screenshots
      - name: Keep the pictures
        uses: actions/upload-artifact@v4
        with:
          name: user-guide-screenshots
          path: screenshots/*.png
      # The Word documents are built from the Markdown here, so a broken
      # table or a missing picture fails the run.  The .docx and .pdf in
      # docs/ are built on a PC with Word (tools/build_docs.py) and committed.
      - name: The user guide and reference manual as Word documents
        run: |
          pip install python-docx
          python3 tools/build_docs.py --no-pdf

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      # The specification: the last Perl release, beside this tree.
      - uses: actions/checkout@v4
        with:
          ref: cfafeeff99bc8ae4cc60b9215237ff989fab2859
          path: perl-1.6.0
      - name: The Python against PHCP 1.6.0 (Perl), byte for byte
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          # The report and --save run the demand search, which re-solves a
          # model many times: in Perl the grids above G050 take too long
          # for the runner there.  Their text and JSON are still compared.
          BIG_GRIDS: '^G(0[5-9][0-9]|1[0-9][0-9])$'
        run: |
          set -e
          # A pull request, and a release (a tag or a published release: the
          # commit main has already checked in full), run the sample; a push
          # to main or a run by hand, everything the runner's time allows.
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = release ] || [ "$REF_TYPE" = tag ]; then
            python3 tools/compare_perl.py --perl perl-1.6.0 -v --set examples
            python3 tools/compare_perl.py --perl perl-1.6.0 -v --modes text,json --every 10 \
              --set models --set models_A --set models_B
            python3 tools/compare_perl.py --perl perl-1.6.0 -v --modes report,save --every 10 \
              --skip "$BIG_GRIDS" --set models --set models_A --set models_B
          else
            python3 tools/compare_perl.py --perl perl-1.6.0 -v --set examples
            python3 tools/compare_perl.py --perl perl-1.6.0 -v --modes text,json \
              --set models --set models_A --set models_B
            python3 tools/compare_perl.py --perl perl-1.6.0 -v --modes report,save --every 5 \
              --skip "$BIG_GRIDS" --set models --set models_A --set models_B
          fi

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with build_windows.py
        shell: pwsh
        run: python build_windows.py
      # The icon, read back out of each built program.  First its resources,
      # byte for byte against data/phcp.ico; then the icon Windows itself
      # shows for the file, pixel for pixel against the one it shows for
      # data/phcp.ico.  v1.0.0's log said the icon was set while Explorer
      # showed the packager's; either check would have caught that.
      - name: The icon on the programs
        shell: pwsh
        run: |
          $bad = 0
          foreach ($exe in 'phcp.exe', 'phcp_editor.exe', 'phcp_sheet.exe', 'phcp_isometric.exe') {
            python tools\check_exe_icon.py $exe data\phcp.ico
            if ($LASTEXITCODE) { $bad++ }
          }
          exit $bad
      - name: The icon as Windows shows it
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $want = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path data\phcp.ico).Path).ToBitmap()
          $bad = 0
          foreach ($exe in 'phcp.exe', 'phcp_editor.exe', 'phcp_sheet.exe', 'phcp_isometric.exe') {
            $got = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path).ToBitmap()
            $diff = 0
            for ($x = 0; $x -lt $got.Width; $x++) { for ($y = 0; $y -lt $got.Height; $y++) {
              if ($got.GetPixel($x, $y).ToArgb() -ne $want.GetPixel($x, $y).ToArgb()) { $diff++ } } }
            "$exe : the icon Windows shows, $($got.Width)x$($got.Height): $diff pixels differ from data\phcp.ico"
            if ($diff) { $bad++ }
          }
          exit $bad
      - name: Test suites that need no display, on Windows
        shell: pwsh
        run: |
          $files = @(Get-ChildItem tools\test_*.py | Where-Object { $_.Name -notlike '*_window.py' }) + @(Get-Item tools\check_lisp.py)
          foreach ($t in $files) {
            "== $($t.Name)"
            python $t.FullName
            if ($LASTEXITCODE) { exit 1 }
          }
      # The models that must not be accepted, through the program a user
      # runs: the built phcp.exe, not the script it was built from.
      - name: Impossible models refused by the built phcp.exe
        shell: pwsh
        run: python tools\test_impossible.py phcp.exe
      - name: Keep the programs
        uses: actions/upload-artifact@v4
        with:
          name: phcp-windows
          path: |
            phcp.exe
            phcp_editor.exe
            phcp_sheet.exe
            phcp_isometric.exe
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    needs: [test-linux, parity, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phcp-windows
      - name: Attach the programs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -e
          files="phcp.exe"
          [ -f phcp_editor.exe ] && files="$files phcp_editor.exe"
          [ -f phcp_sheet.exe ] && files="$files phcp_sheet.exe"
          [ -f phcp_isometric.exe ] && files="$files phcp_isometric.exe"
          for d in docs/PHCP_User_Guide docs/PHCP_Reference_Manual; do
            for x in docx pdf; do [ -f "$d.$x" ] && files="$files $d.$x"; done
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          elif [ -f "release_notes/$TAG.md" ]; then
            gh release create "$TAG" $files --title "PHCP ${TAG#v}" --notes-file "release_notes/$TAG.md"
          else
            gh release create "$TAG" $files --title "PHCP ${TAG#v}" --generate-notes
          fi
