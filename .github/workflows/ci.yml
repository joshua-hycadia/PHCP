# PHCP continuous integration and release.
#
#   test-linux      every test suite, including the Revit extension without
#                   Revit, and the editor, spreadsheet and isometric windows
#                   under a virtual display; then the user guide's pictures
#                   (tools/doc_screenshots.pl), kept as the run's artefact
#   build-windows   build_windows.bat on a Windows runner, exactly as on a PC:
#                   phcp.exe, phcp_editor.exe, phcp_sheet.exe and
#                   phcp_isometric.exe, the smoke test, the icon read back out
#                   of each, then the test suites that need no display,
#                   including the Revit extension; the programs are kept as
#                   the run's artefacts
#   release         on a version tag (v1.2.3) or a release published on
#                   GitHub: the programs, the user guide and the reference
#                   manual (docs/*.docx, docs/*.pdf) attached to the release,
#                   with the notes in release_notes/<tag>.md if there are any
#
# Runs on every pull request and every push to main.

name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Perl/Tk and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y perl-tk xvfb xauth imagemagick
      - name: Test suites
        run: |
          set -e
          for t in test_curves test_phc test_pipedata test_report_checks test_pdf test_json \
                   test_editor test_sheet test_dbedit test_isometric test_graph test_tools test_sizing test_manual test_velocity_pressure test_validate test_supplies test_dpv test_results test_drytime \
                   test_acceptance test_benchmarks test_impossible test_check_valves check_lisp stress_resolver; do
            echo "== $t"
            perl tools/$t.pl
          done
      - name: Revit extension, without Revit
        run: python3 tools/test_revit.py
      - name: Editor window, under Xvfb
        run: perl tools/test_editor_window.pl
      - name: Spreadsheet window, under Xvfb
        run: perl tools/test_sheet_window.pl
      - name: Isometric window, under Xvfb
        run: perl tools/test_isometric_window.pl
      - name: Invariance stress, 60 random networks
        run: perl tools/stress_invariance.pl 60
      - name: The user guide's pictures, under Xvfb
        run: perl tools/doc_screenshots.pl screenshots
      - name: Keep the pictures
        uses: actions/upload-artifact@v4
        with:
          name: user-guide-screenshots
          path: screenshots/*.png
      # The Word documents are built from the Markdown here, so a broken
      # table or a missing picture fails the run.  The .docx and .pdf in
      # docs/ are built on a PC with Word (tools/build_docs.py) and committed.
      - name: The user guide and reference manual as Word documents
        run: |
          pip install python-docx
          python3 tools/build_docs.py --no-pdf

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with build_windows.bat
        shell: cmd
        run: |
          set PATH=C:\Strawberry\c\bin;C:\Strawberry\perl\site\bin;C:\Strawberry\perl\bin;%PATH%
          call build_windows.bat
      # The icon, read back out of each built program.  First its resources,
      # byte for byte against data/phcp.ico; then the icon Windows itself
      # shows for the file, pixel for pixel against the one it shows for
      # data/phcp.ico.  v1.0.0's log said the icon was set while Explorer
      # showed the packager's; either check would have caught that.
      - name: The icon on the programs
        shell: cmd
        run: |
          set PATH=C:\Strawberry\c\bin;C:\Strawberry\perl\site\bin;C:\Strawberry\perl\bin;%PATH%
          perl tools\check_exe_icon.pl phcp.exe data\phcp.ico || exit /b 1
          perl tools\check_exe_icon.pl phcp_editor.exe data\phcp.ico || exit /b 1
          perl tools\check_exe_icon.pl phcp_sheet.exe data\phcp.ico || exit /b 1
          perl tools\check_exe_icon.pl phcp_isometric.exe data\phcp.ico || exit /b 1
      - name: The icon as Windows shows it
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $want = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path data\phcp.ico).Path).ToBitmap()
          $bad = 0
          foreach ($exe in 'phcp.exe', 'phcp_editor.exe', 'phcp_sheet.exe', 'phcp_isometric.exe') {
            $got = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path).ToBitmap()
            $diff = 0
            for ($x = 0; $x -lt $got.Width; $x++) { for ($y = 0; $y -lt $got.Height; $y++) {
              if ($got.GetPixel($x, $y).ToArgb() -ne $want.GetPixel($x, $y).ToArgb()) { $diff++ } } }
            "$exe : the icon Windows shows, $($got.Width)x$($got.Height): $diff pixels differ from data\phcp.ico"
            if ($diff) { $bad++ }
          }
          exit $bad
      - name: Test suites that need no display, on Windows
        shell: cmd
        run: |
          set PATH=C:\Strawberry\c\bin;C:\Strawberry\perl\site\bin;C:\Strawberry\perl\bin;%PATH%
          for %%t in (test_curves test_phc test_pipedata test_report_checks test_pdf test_json test_editor test_sheet test_dbedit test_isometric test_graph test_tools test_sizing test_manual test_velocity_pressure test_validate test_supplies test_dpv test_results test_drytime test_acceptance test_benchmarks test_impossible test_check_valves check_lisp) do (
            echo == %%t
            perl tools\%%t.pl || exit /b 1
          )
      # The models that must not be accepted, through the program a user
      # runs: the built phcp.exe, not the script it was built from.
      - name: Impossible models refused by the built phcp.exe
        shell: cmd
        run: |
          set PATH=C:\Strawberry\c\bin;C:\Strawberry\perl\site\bin;C:\Strawberry\perl\bin;%PATH%
          perl tools\test_impossible.pl phcp.exe || exit /b 1
      - name: Revit extension, without Revit
        shell: pwsh
        run: python tools\test_revit.py
      - name: Keep the programs
        uses: actions/upload-artifact@v4
        with:
          name: phcp-windows
          path: |
            phcp.exe
            phcp_editor.exe
            phcp_sheet.exe
            phcp_isometric.exe
            tk_build.log
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    needs: [test-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phcp-windows
      - name: Attach the programs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -e
          files="phcp.exe"
          [ -f phcp_editor.exe ] && files="$files phcp_editor.exe"
          [ -f phcp_sheet.exe ] && files="$files phcp_sheet.exe"
          [ -f phcp_isometric.exe ] && files="$files phcp_isometric.exe"
          for d in docs/PHCP_User_Guide docs/PHCP_Reference_Manual; do
            for x in docx pdf; do [ -f "$d.$x" ] && files="$files $d.$x"; done
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          elif [ -f "release_notes/$TAG.md" ]; then
            gh release create "$TAG" $files --title "PHCP ${TAG#v}" --notes-file "release_notes/$TAG.md"
          else
            gh release create "$TAG" $files --title "PHCP ${TAG#v}" --generate-notes
          fi
