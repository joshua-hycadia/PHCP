# PHCP continuous integration and release.
#
#   test-linux     the Python test suites, including the Revit extension
#                  without Revit, and the editor, spreadsheet and isometric
#                  windows under a virtual display; then the user guide and
#                  reference manual as Word documents, which fails the run if
#                  a table or picture is broken
#   build-windows  build_windows.py on a Windows runner, exactly as on a PC:
#                  phcp.exe, phcp_editor.exe, phcp_sheet.exe and
#                  phcp_isometric.exe by PyInstaller, the smoke test in the
#                  script, then the impossible models through the built
#                  phcp.exe; the programs are kept as the run's artefacts
#   release        on a version tag (v1.2.3) or a release published on
#                  GitHub: the programs, the user guide and the reference
#                  manual (docs/*.docx, docs/*.pdf) attached to the release,
#                  with the notes in release_notes/<tag>.md if there are any
#
# Runs on every pull request and every push to main.

name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python/Tk and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth imagemagick python3-tk
      - name: Test suites
        run: |
          set -e
          for t in test_editor test_isometric test_revit; do
            echo "== $t"
            python3 tools/$t.py
          done
      - name: Windows suites, under Xvfb
        run: |
          set -e
          python3 tools/test_editor_window.py
          python3 tools/test_sheet_window.py
          python3 tools/test_isometric_window.py
      # The Word documents are built from the Markdown here, so a broken
      # table or a missing picture fails the run.  The .docx and .pdf in
      # docs/ are built on a PC with Word (tools/build_docs.py) and committed.
      - name: The user guide and reference manual as Word documents
        run: |
          pip install python-docx
          python3 tools/build_docs.py --no-pdf

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with build_windows.py
        shell: pwsh
        run: python build_windows.py
      # The models that must not be accepted, through the program a user
      # runs: the built phcp.exe, not the script it was built from.
      - name: Impossible models refused by the built phcp.exe
        shell: pwsh
        run: python tools/test_impossible.py dist\phcp.exe
      - name: Keep the programs
        uses: actions/upload-artifact@v4
        with:
          name: phcp-windows
          path: |
            dist/phcp.exe
            dist/phcp_editor.exe
            dist/phcp_sheet.exe
            dist/phcp_isometric.exe
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    needs: [test-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phcp-windows
      - name: Attach the programs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -e
          files="phcp.exe"
          [ -f phcp_editor.exe ] && files="$files phcp_editor.exe"
          [ -f phcp_sheet.exe ] && files="$files phcp_sheet.exe"
          [ -f phcp_isometric.exe ] && files="$files phcp_isometric.exe"
          for d in docs/PHCP_User_Guide docs/PHCP_Reference_Manual; do
            for x in docx pdf; do [ -f "$d.$x" ] && files="$files $d.$x"; done
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          elif [ -f "release_notes/$TAG.md" ]; then
            gh release create "$TAG" $files --title "PHCP ${TAG#v}" --notes-file "release_notes/$TAG.md"
          else
            gh release create "$TAG" $files --title "PHCP ${TAG#v}" --generate-notes
          fi
